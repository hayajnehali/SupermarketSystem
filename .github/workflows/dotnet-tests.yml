name: .NET Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (.NET 10)
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: "Test_password_2026!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Test_password_2026!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s
    env:
      SUPERMARKET_SQLSERVER_TEST_CONNECTION: "Server=localhost,1433;Database=SupermarketSkuIntegrationTests;User Id=sa;Password=Test_password_2026!;TrustServerCertificate=True;Encrypt=False"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show SDK information
        run: dotnet --info

      - name: Build solution
        run: dotnet build SupermarketSystem.sln --configuration Release --verbosity minimal

      - name: Run all test projects
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' projects < <(find tests -type f -name '*.csproj' ! -path 'tests/Architecture.Tests/*' -print0)
          if [ "${#projects[@]}" -eq 0 ]; then
            echo "No test projects were found under tests/."
            exit 1
          fi
          for project in "${projects[@]}"; do
            echo "::group::Testing ${project}"
            dotnet test "${project}" --configuration Release --no-build --no-restore --verbosity minimal
            echo "::endgroup::"
          done

  architecture:
    name: Architecture tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run architecture guard tests
        run: dotnet test tests/Architecture.Tests/Architecture.Tests.csproj --configuration Release --verbosity minimal
